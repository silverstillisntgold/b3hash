[package]
name = "b3hash"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8", features = ["serde"] }
bon = "3.8"
camino = { version = "1.2", features = ["serde1"] }
crossbeam-channel = "0.5"
globset = { version = "0.4", default-features = false }
parking_lot = "0.12"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
