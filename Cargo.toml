[package]
name = "b3hash"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = { version = "1.8.3", features = ["serde"] }
bon = "3.8.2"
camino = { version = "1.2.2", features = ["serde1"] }
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
zstd = { version = "0.13.3", default-features = false }
